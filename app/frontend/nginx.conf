# Configuración de Nginx para servir la aplicación Vue
# Redirige todas las rutas al index.html para que Vue Router funcione correctamente
# Las peticiones a /api se redirigen al backend

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve los archivos estáticos y redirige todo lo demás al index.html
    # Esto es necesario para que Vue Router funcione con rutas como /catalogo
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las imágenes de productos se sirven directamente desde Nginx
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Compresión gzip para mejorar el rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}