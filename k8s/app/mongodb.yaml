# MongoDB en StatefulSet para CapiShop
# Se usa StatefulSet porque MongoDB necesita identidad persistente
# y almacenamiento dedicado por pod para que los datos sobrevivan reinicios
#
# El headless service permite que los pods se comuniquen entre sí
# por nombre DNS estable: mongodb-0.mongodb-headless.capishop.svc.cluster.local

# Headless Service para MongoDB
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: capishop
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      name: mongodb

---
# Service para que el backend se conecte a MongoDB
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: capishop
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: capishop
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: capishop
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

  # Cada pod obtiene su propio PVC con almacenamiento en NFS
  # Así los datos de MongoDB sobreviven al reinicio del pod
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 1Gi