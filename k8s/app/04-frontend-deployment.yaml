apiVersion: apps/v1
kind: Deployment
metadata:
  name: capishop-frontend
  namespace: default
  labels:
    app: capishop-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capishop-frontend
  template:
    metadata:
      labels:
        app: capishop-frontend
    spec:
      containers:
        - name: frontend
          image: isabelkitty/capishop-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
