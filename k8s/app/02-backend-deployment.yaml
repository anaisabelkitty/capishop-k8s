apiVersion: apps/v1
kind: Deployment
metadata:
  name: capishop-backend
  namespace: default
  labels:
    app: capishop-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capishop-backend
  template:
    metadata:
      labels:
        app: capishop-backend
    spec:
      containers:
        - name: backend
          image: isabelkitty/capishop-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
