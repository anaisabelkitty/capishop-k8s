# NetworkPolicies que dejan al Ingress controller entrar a la app
# La primera abre el frontend (80) y la segunda el backend (3000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: default
spec:
  # Aplica a los pods del frontend
  podSelector:
    matchLabels:
      app: capishop-frontend
  policyTypes:
    - Ingress
  # Solo acepta tráfico del namespace ingress-nginx hacia el puerto 80
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: default
spec:
  # Aplica a los pods del backend
  podSelector:
    matchLabels:
      app: capishop-backend
  policyTypes:
    - Ingress
  # Solo acepta tráfico del namespace ingress-nginx hacia el puerto 3000
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
