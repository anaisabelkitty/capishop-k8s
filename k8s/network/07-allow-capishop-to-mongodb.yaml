apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-capishop-backend-to-mongodb
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: capishop
        - podSelector:
            matchLabels:
              app: capishop-backend
      ports:
        - protocol: TCP
          port: 27017
