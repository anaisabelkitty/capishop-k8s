# Service headless de MongoDB
# El clusterIP None le da DNS propio a cada pod, así arma el replica set
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: default
  labels:
    app: mongodb
spec:
  clusterIP: None
  # Conecta con los pods que tengan la etiqueta app: mongodb
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
