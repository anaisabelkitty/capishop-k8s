# Secret con las credenciales de MongoDB
# Guarda la contraseña del usuario root y la llave que usan los nodos del replica set
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: default
type: Opaque
# stringData deja poner los valores en texto plano y K8s los codifica solo
stringData:
  mongodb-root-password: "capishop123"
  mongodb-replica-set-key: "capishopReplicaKey2026"
