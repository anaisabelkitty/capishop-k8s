---
# Playbook principal para instalar y configurar el cluster de Kubernetes
# Se ejecuta desde el master hacia todos los nodos usando Ansible

# ============================================================
# PARTE 1: Copiar /etc/hosts a todos los nodos
# Así todos los nodos se reconocen entre sí por nombre
# ============================================================
- name: Copiar /etc/hosts a todos los nodos
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Copiar /etc/hosts desde el master a todos los nodos
      copy:
        src: /etc/hosts
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        backup: yes

    - name: Verificar contenido de /etc/hosts
      command: cat /etc/hosts
      register: hosts_content
      changed_when: false

    - name: Mostrar /etc/hosts actualizado
      debug:
        msg: "{{ hosts_content.stdout_lines }}"

    - name: Validar que los nodos se resuelven por nombre
      shell: |
        getent hosts capishop-master01 || echo "FALLO: capishop-master01"
        getent hosts capishop-worker01 || echo "FALLO: capishop-worker01"
        getent hosts capishop-worker02 || echo "FALLO: capishop-worker02"
      register: dns_check
      changed_when: false
      failed_when: "'FALLO' in dns_check.stdout"

# ============================================================
# PARTE 2: Preparar todos los nodos para Kubernetes
# Deshabilita swap, carga módulos del kernel y configura
# los parámetros de red que Kubernetes necesita para funcionar
# ============================================================
- name: Preparar todos los nodos para Kubernetes
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Deshabilitar SELinux
      selinux:
        state: disabled

    - name: Deshabilitar swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

    - name: Cargar módulos del kernel necesarios para Kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Aplicar módulos del kernel
      shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Configurar parámetros de red para Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Aplicar configuración sysctl
      command: sysctl --system

    - name: Agregar repositorio de Docker para instalar containerd
      shell: |
        dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo

    - name: Instalar containerd
      dnf:
        name: containerd.io
        state: present

    - name: Crear directorio de configuración de containerd
      file:
        path: /etc/containerd
        state: directory

    - name: Generar configuración por defecto de containerd
      shell: containerd config default > /etc/containerd/config.toml

    - name: Configurar SystemdCgroup en containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Iniciar y habilitar containerd
      systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Agregar repositorio de Kubernetes
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/repodata/repomd.xml.key

    - name: Instalar kubelet, kubeadm y kubectl
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Iniciar y habilitar kubelet
      systemd:
        name: kubelet
        state: started
        enabled: yes

# ============================================================
# PARTE 3: Inicializar el master
# Aquí se inicializa el cluster y se instala Flannel CNI
# que es la red que permite comunicación entre pods
# ============================================================
- name: Inicializar Master Node
  hosts: k8s_master
  become: yes

  tasks:
    - name: Configurar firewall en el master
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 6443/tcp
        - 2379-2380/tcp
        - 10250/tcp
        - 10251/tcp
        - 10252/tcp
        - 10255/tcp
        - 8285/udp
        - 8472/udp

    - name: Verificar si el cluster ya está inicializado
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Inicializar el cluster
      shell: |
        kubeadm init --pod-network-cidr=10.244.0.0/16 \
        --apiserver-advertise-address=192.168.224.135
      register: kubeadm_init
      when: not k8s_initialized.stat.exists

    - name: Crear directorio .kube para root
      file:
        path: /root/.kube
        state: directory

    - name: Copiar kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: Verificar si Flannel ya está instalado
      shell: kubectl get pods -n kube-system | grep flannel | grep Running | wc -l
      register: flannel_check
      changed_when: false
      failed_when: false

    - name: Instalar Flannel CNI
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      when: flannel_check.stdout == "0"

    - name: Esperar a que Flannel esté listo
      shell: |
        for i in $(seq 1 30); do
          count=$(kubectl get pods -n kube-system | grep flannel | grep Running | wc -l)
          if [ "$count" -gt "0" ]; then
            echo "Flannel listo"
            exit 0
          fi
          sleep 10
        done
        exit 1
      when: flannel_check.stdout == "0"

    - name: Generar token de join para los workers
      shell: kubeadm token create --print-join-command
      register: join_command
      changed_when: true

    - name: Guardar el comando de join
      set_fact:
        k8s_join_command: "{{ join_command.stdout }}"

    - name: Mostrar comando de join
      debug:
        msg: "Comando de join: {{ join_command.stdout }}"

# ============================================================
# PARTE 4: Unir los workers al cluster
# Usa el comando de join que generó el master
# ============================================================
- name: Unir Workers al Cluster
  hosts: k8s_workers
  become: yes

  tasks:
    - name: Configurar firewall en los workers
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 10250/tcp
        - 30000-32767/tcp
        - 8285/udp
        - 8472/udp

    - name: Verificar si el nodo ya está en el cluster
      shell: kubectl get nodes | grep {{ inventory_hostname }} || echo "not_found"
      register: node_check
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false
      failed_when: false

    - name: Mostrar estado del nodo
      debug:
        msg: "Nodo {{ inventory_hostname }}: {{ 'Ya está en el cluster' if 'not_found' not in node_check.stdout else 'Se va a agregar' }}"

    - name: Reset kubeadm si el nodo ya intentó unirse antes
      command: kubeadm reset -f
      when: "'not_found' in node_check.stdout"

    - name: Limpiar configuración previa de CNI
      shell: |
        rm -rf /etc/cni/net.d/*
        rm -rf /var/lib/kubelet/*
        rm -rf /var/lib/etcd/*
      when: "'not_found' in node_check.stdout"

    - name: Reiniciar containerd y kubelet
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - containerd
        - kubelet
      when: "'not_found' in node_check.stdout"

    - name: Unir worker al cluster
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command'] }}"
      register: join_result
      when: "'not_found' in node_check.stdout"

    - name: Mostrar resultado del join
      debug:
        msg: "{{ join_result.stdout_lines }}"
      when:
        - "'not_found' in node_check.stdout"
        - join_result.stdout is defined
