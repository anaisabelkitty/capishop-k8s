# ConfigMap con la configuración de Loki
# Define el puerto, dónde guarda los chunks y el esquema de los índices
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    # Loki escucha en el puerto 3100
    server:
      http_listen_port: 3100

    # Guarda los logs en el sistema de archivos (el PVC montado en /loki)
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    # Esquema de los índices de los logs
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://localhost:9093
