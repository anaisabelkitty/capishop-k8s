# ConfigMap con la configuración de Promtail
# Define a qué Loki manda los logs y cómo etiqueta los de cada pod
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    # Guarda hasta dónde leyó cada log para no repetir al reiniciar
    positions:
      filename: /run/promtail/positions.yaml

    # A dónde manda los logs: el service de Loki
    clients:
      - url: http://loki.monitoring.svc:3100/loki/api/v1/push

    # Descubre los pods y les arma etiquetas (namespace, pod, container) y la ruta del log
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
