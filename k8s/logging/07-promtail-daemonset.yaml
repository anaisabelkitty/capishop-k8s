# DaemonSet de Promtail: corre un pod en cada nodo
# Lee los logs de los contenedores del host y se los manda a Loki
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      # Usa la service account con permisos para descubrir pods
      serviceAccountName: promtail
      # Tolerancia para correr también en el nodo master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          # Le indica el archivo de configuración a usar
          args:
            - -config.file=/etc/promtail/promtail.yaml
          # Toma el nombre del nodo para etiquetar los logs
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "200m"
          # Monta la config y los logs del host (/var/log) en solo lectura
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: run
              mountPath: /run/promtail
      # config viene del ConfigMap; varlog y run apuntan a carpetas del nodo
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: run
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
