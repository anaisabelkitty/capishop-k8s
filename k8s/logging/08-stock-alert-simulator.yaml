apiVersion: v1
kind: Pod
metadata:
  name: stock-simulator
  namespace: default
  labels:
    app: stock-simulator
spec:
  containers:
  - name: stock-simulator
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        echo '{"level":"warn","msg":"stock bajo","producto":"arnes-perro","stock":2,"umbral":5}'
        sleep 20
        echo '{"level":"warn","msg":"stock bajo","producto":"cama-gato","stock":1,"umbral":5}'
        sleep 20
        echo '{"level":"info","msg":"stock normal","producto":"juguete-perro","stock":30}'
        sleep 20
      done
    resources:
      requests:
        memory: "16Mi"
        cpu: "10m"
      limits:
        memory: "32Mi"
        cpu: "50m"
