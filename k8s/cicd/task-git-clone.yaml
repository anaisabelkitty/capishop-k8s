# Task para clonar el repositorio de GitHub
# Es la primera tarea del pipeline, clona el código fuente
# para que las siguientes tasks puedan usarlo

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-pipelines
spec:
  params:
    - name: url
      description: URL del repositorio GitHub
      type: string
    - name: revision
      description: Branch a clonar
      type: string
      default: develop
  workspaces:
    - name: source
      description: Workspace donde se clona el repositorio
  # Clona el repo en el workspace y se cambia al branch indicado
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        git clone $(params.url) $(workspaces.source.path)
        cd $(workspaces.source.path)
        git checkout $(params.revision)
        echo "Repositorio clonado correctamente"
        ls -la
