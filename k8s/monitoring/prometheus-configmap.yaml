# ConfigMap con la configuración de Prometheus
# Aquí se define cada cuánto scrapea y qué objetivos (targets) monitorea
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    # Cada cuánto recoge métricas y evalúa reglas
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Lista de objetivos de los que Prometheus saca métricas
    scrape_configs:
      # El propio Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Métricas de los 3 nodos vía node-exporter
      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - '192.168.224.135:9100'
              - '192.168.224.136:9100'
              - '192.168.224.137:9100'

      # Métricas del estado de los objetos de Kubernetes
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']

      # Métricas del API server, usando el token de la service account
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Métricas de los nodos descubiertos automáticamente
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
