# PVC donde Grafana guarda sus dashboards y configuración
# Pide 2Gi usando la StorageClass de NFS
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 2Gi

