# Deployment de Prometheus, el servidor que recoge y guarda las métricas
# Monta la configuración del ConfigMap y los datos en el PVC
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Usa la service account con los permisos RBAC para leer el cluster
      serviceAccountName: prometheus
      # Corre como root para poder escribir en el volumen de datos
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: prometheus
          image: prom/prometheus:v2.49.0
          # Le indica el archivo de config, dónde guarda datos y cuánto los retiene
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Monta la config (solo lectura) y el disco de datos
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      # El volumen config viene del ConfigMap y storage del PVC
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
